<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Download with godm</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f3f4f7; --panel: #fff; --panel2: #f7f8fa; --line: #e2e5ea; --text: #151920; --muted: #697280; --faint: #9aa2ad;
    --accent: #2f6df6; --accent-soft: #e7eefe; --ok: #1c9551; --err: #d23f3f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111419; --panel: #191d24; --panel2: #1f242c; --line: #2a3039; --text: #e5e8ed; --muted: #8b939e; --faint: #626a75;
      --accent: #5b8cff; --accent-soft: #1d2842; --ok: #3bb471; --err: #ee6b6b;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 13px/1.45 "Segoe UI", system-ui, sans-serif; }
  button, input { font: inherit; color: inherit; }
  form { height: 100%; display: flex; flex-direction: column; }
  header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 12px 16px; }
  h1 { font-size: 15px; margin: 0; }
  .url { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  main { flex: 1; overflow: auto; padding: 14px 16px 6px; }
  .row { display: grid; grid-template-columns: 92px 1fr; align-items: center; gap: 8px; margin-bottom: 11px; }
  .row > label, .row > .lbl { color: var(--muted); }
  .with-btn { display: flex; gap: 6px; }
  .with-btn input { flex: 1; min-width: 0; }
  input[type=text], input[type=number] { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
  input[type=number] { width: 80px; }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #size { font-variant-numeric: tabular-nums; }
  #status { min-height: 2.9em; color: var(--muted); font-size: 12px; }
  #status.err { color: var(--err); }
  footer { background: var(--panel); border-top: 1px solid var(--line); padding: 10px 16px; display: flex; gap: 10px; align-items: center; }
  footer .grow { flex: 1; }
  .chk { display: flex; align-items: center; gap: 6px; color: var(--muted); cursor: pointer; }
  .btn { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 5px 14px; cursor: pointer; }
  .btn:hover { background: var(--panel2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; min-width: 76px; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn:disabled { opacity: .5; cursor: default; filter: none; }
</style>
</head>
<body>
<form id="form" novalidate autocomplete="off">
  <header>
    <h1>Download with godm</h1>
    <div class="url" id="url"></div>
  </header>
  <main>
    <div class="row">
      <label for="name">File name</label>
      <input type="text" id="name" spellcheck="false">
    </div>
    <div class="row">
      <span class="lbl">Size</span>
      <span id="size"></span>
    </div>
    <div class="row">
      <label for="dir">Save to</label>
      <div class="with-btn">
        <input type="text" id="dir" spellcheck="false" placeholder="godm's default download folder">
        <button type="button" class="btn" id="browse">Browse…</button>
      </div>
    </div>
    <div class="row">
      <label for="conns">Connections</label>
      <input type="number" id="conns" min="1" max="32" step="1">
    </div>
    <div id="status" role="status"></div>
  </main>
  <footer>
    <label class="chk" title="Turns this dialog off. You can turn it back on in the extension's settings.">
      <input type="checkbox" id="dontAsk"> Don't ask again
    </label>
    <span class="grow"></span>
    <button type="button" class="btn" id="cancel">Cancel</button>
    <button type="submit" class="btn primary" id="start">Start</button>
  </footer>
</form>
<script src="handoff.js"></script>
<script src="confirm.js"></script>
</body>
</html>
