<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; --line:#e2e5ea; --muted:#6b7480; --accent:#2f6df6; --track:#e8ebf0; --ok:#1f9d55; --err:#d64545; }
  @media (prefers-color-scheme: dark) {
    :root { --line:#2a3038; --muted:#8a929c; --accent:#5b8cff; --track:#262c34; --ok:#37b26b; --err:#ef6a6a; }
  }
  body { width: 340px; margin: 0; padding: 12px; font: 13px/1.45 "Segoe UI", system-ui, sans-serif; }
  header { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  h1 { font-size:13px; margin:0; flex:1; letter-spacing:.4px; }
  .link { color: var(--accent); cursor:pointer; text-decoration:none; font-size:12px; }
  .task { padding:7px 0; border-top:1px solid var(--line); }
  .row { display:flex; gap:8px; align-items:baseline; }
  .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
  .meta { color:var(--muted); font-size:11px; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .track { height:4px; background:var(--track); border-radius:2px; margin-top:5px; overflow:hidden; }
  .fill { height:100%; background:var(--accent); border-radius:2px; }
  .fill.done { background:var(--ok); }
  .fill.error { background:var(--err); }
  .msg { color:var(--muted); padding:14px 0; text-align:center; }
  .msg.bad { color:var(--err); text-align:left; }
  label { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); }
  .sec { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin:0 0 6px; }
  .media { border:1px solid var(--line); border-radius:6px; padding:7px 8px; margin-bottom:6px; }
  .media .row { align-items:center; }
  .chip { font-size:10px; font-weight:700; letter-spacing:.4px; padding:1px 5px; border-radius:3px;
          background:var(--track); color:var(--muted); flex:none; }
  .chip.hls { background:var(--accent); color:#fff; }
  .foot { display:flex; gap:6px; align-items:center; margin-top:6px; }
  .foot select { flex:1; min-width:0; font:inherit; font-size:12px; padding:2px 4px;
                 border:1px solid var(--line); border-radius:4px; background:transparent; color:inherit; }
  .go { flex:none; padding:3px 10px; border-radius:4px; border:0; background:var(--accent);
        color:#fff; font:inherit; font-size:12px; cursor:pointer; }
  .go[disabled] { background:var(--track); color:var(--muted); cursor:default; }
</style>
</head>
<body>
<header>
  <h1>godm</h1>
  <label><input type="checkbox" id="enabled"> <span data-i18n="popup_takeover"></span></label>
  <a class="link" id="open" data-i18n="popup_manager"></a>
  <a class="link" id="opts" data-i18n="popup_settings"></a>
</header>
<div id="media"></div>
<button id="grab" data-i18n="popup_grab" style="width:100%;margin-bottom:10px;padding:6px;border-radius:6px;border:1px solid var(--line);background:transparent;color:inherit;font:inherit;cursor:pointer"></button>
<div id="body"><div class="msg" data-i18n="popup_loading"></div></div>
<script src="i18n.js"></script>
<script src="popup.js"></script>
</body>
</html>
