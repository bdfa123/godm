<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>godm — pick links</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f3f4f7; --panel: #fff; --panel2: #f7f8fa; --line: #e2e5ea; --text: #151920; --muted: #697280; --faint: #9aa2ad;
    --accent: #2f6df6; --accent-soft: #e7eefe; --ok: #1c9551; --err: #d23f3f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111419; --panel: #191d24; --panel2: #1f242c; --line: #2a3039; --text: #e5e8ed; --muted: #8b939e; --faint: #626a75;
      --accent: #5b8cff; --accent-soft: #1d2842; --ok: #3bb471; --err: #ee6b6b;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 13px/1.45 "Segoe UI", system-ui, sans-serif; display: flex; flex-direction: column; }
  button, input { font: inherit; color: inherit; }
  header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 12px 16px; }
  h1 { font-size: 15px; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sub { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  input[type=search], input[type=number] { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
  input[type=search] { flex: 1; min-width: 180px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .chip { border: 1px solid var(--line); background: var(--panel2); border-radius: 999px; padding: 2px 10px; cursor: pointer; font-size: 12px; }
  .chip b { font-weight: 700; }
  .chip span { color: var(--faint); margin-left: 4px; }
  .chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .btn { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 5px 11px; cursor: pointer; }
  .btn:hover { background: var(--panel2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn:disabled { opacity: .5; cursor: default; }
  .link { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0 4px; }
  .scroll { flex: 1; overflow: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { position: sticky; top: 0; background: var(--panel2); text-align: left; font-weight: 600; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line); font-size: 12px; }
  td { padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:hover td { background: var(--panel); }
  tr.off td { color: var(--faint); }
  .name { font-weight: 600; word-break: break-all; }
  .text { color: var(--muted); font-size: 12px; }
  .url { color: var(--faint); font-size: 11.5px; word-break: break-all; }
  .ext { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  footer { background: var(--panel); border-top: 1px solid var(--line); padding: 10px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  footer .grow { flex: 1; color: var(--muted); }
  .status.ok { color: var(--ok); } .status.err { color: var(--err); }
  .empty { padding: 50px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1 id="title">Links on this page</h1>
  <div class="sub" id="page"></div>
</header>
<div class="bar">
  <input type="search" id="search" placeholder="Filter by name, text or address" autocomplete="off">
  <span>Select:</span>
  <button class="link" id="selFiles" title="Links whose type is in your godm file type list">files</button>
  <button class="link" id="selAll">all shown</button>
  <button class="link" id="selNone">none</button>
</div>
<div class="chips" id="chips"></div>
<div class="scroll">
  <table>
    <thead><tr><th style="width:28px"><input type="checkbox" id="toggleShown" title="Select every shown link"></th><th>File</th><th style="width:60px">Type</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty" id="empty" hidden>No links match.</div>
</div>
<footer>
  <span class="grow" id="count"></span>
  <span class="status" id="status"></span>
  <label>Connections <input type="number" id="conns" min="1" max="32" style="width:60px"></label>
  <button class="btn" id="cancel">Cancel</button>
  <button class="btn primary" id="go" disabled>Download</button>
</footer>
<script src="picker.js"></script>
</body>
</html>
