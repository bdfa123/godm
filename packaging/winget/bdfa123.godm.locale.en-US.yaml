ShortDescription: Segmented, resumable download manager that takes over browser downloads
Description: |-
  godm splits each download over several connections, resumes it after a crash,
  a reboot or a dropped connection, and takes over downloads from Chrome and
  Edge through a browser extension. It also downloads HLS video and can play a
  file in mpv or VLC while it is still arriving.

  The browser extension is in the extension folder next to godm.exe. Load it
  unpacked, then run "godm install --ext-id <id>" to connect the browser to godm.
